services:
  - type: web
    name: gymllm
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional shared model so visitors need no key of their own.
      - key: SITE_LLM_API_KEY
        sync: false
      - key: SITE_LLM_PROVIDER
        value: groq
      - key: SITE_LLM_DAILY_LIMIT
        value: "20"
