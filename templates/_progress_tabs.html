{% set ep = request.endpoint or '' %}
<div class="page-head">
    <h1>Progress</h1>
</div>
<nav class="tabs" aria-label="Progress sections">
    <a href="{{ url_for('main.progress') }}" class="{{ 'active' if ep == 'main.progress' }}">Overview</a>
    <a href="{{ url_for('main.search') }}" class="{{ 'active' if ep == 'main.search' }}">Sessions</a>
    <a href="{{ url_for('main.exercises') }}" class="{{ 'active' if ep in ('main.exercises', 'main.exercise_history') }}">Exercises</a>
</nav>
