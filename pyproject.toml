[tool.ruff]
line-length = 100
target-version = "py310"  # Render runs 3.10; keep the code compatible
extend-exclude = [".venv", "instance"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
