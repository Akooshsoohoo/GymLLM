# The Xcode project is generated from this file: `xcodegen generate` in ios/.
# Levra.xcodeproj and Levra/Info.plist are build output and are not committed.
name: Levra

options:
  bundleIdPrefix: com.levraapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set once the owner has picked a team in Xcode, or regenerating wipes it.
    DEVELOPMENT_TEAM: 3JV9Y565WX
    # From the iOS OAuth client in Google Cloud. Empty until it exists: the app then
    # says Google sign-in isn't set up instead of opening it.
    GOOGLE_IOS_CLIENT_ID: 43894553304-79v7fo5uk49faofn3ruf0pp88l08rj65.apps.googleusercontent.com
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.43894553304-79v7fo5uk49faofn3ruf0pp88l08rj65

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  Levra:
    type: application
    platform: iOS
    sources:
      - path: Levra
        excludes:
          - "Resources/Fonts/*.txt"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levraapp.Levra
        PRODUCT_NAME: Levra
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Levra/Info.plist
      properties:
        CFBundleDisplayName: Levra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: bg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - InstrumentSans-Regular.ttf
          - InstrumentSans-Medium.ttf
          - InstrumentSans-SemiBold.ttf
          - InstrumentSans-Bold.ttf
        # Plain http to the Mac's local Flask from the simulator. Nothing else is exempt.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)

  # Drives the core loop, Progress and Day in the simulator against the local server
  # (python ios/scripts/dev_server.py) and keeps a screenshot of every screen.
  LevraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LevraUITests
    dependencies:
      - target: Levra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levraapp.LevraUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Levra

schemes:
  Levra:
    build:
      targets:
        Levra: all
        LevraUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LevraUITests
    archive:
      config: Release
